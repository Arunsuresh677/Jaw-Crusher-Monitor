<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crusher Monitor — Kannan Blue Metals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.2/chart.umd.min.js"></script>
<style>
:root {
  --navy:#1a2f5e; --navy-h:#243d78; --navy-a:rgba(255,255,255,0.12);
  --brand:#f59e0b; --brand-d:#d97706;
  --blue:#2563eb; --blue-l:#eff6ff;
  --green:#16a34a; --green-l:#dcfce7;
  --red:#dc2626; --red-l:#fee2e2;
  --yellow:#d97706; --yellow-l:#fef3c7;
  --page:#f1f5f9; --card:#fff;
  --t1:#0f172a; --t2:#475569; --t3:#94a3b8;
  --border:#e2e8f0; --border2:#cbd5e1;
  --sw:220px; --th:56px;
  --r:12px; --rs:8px; --rx:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--t1);font-size:14px;line-height:1.5}

/* ── Sidebar ── */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sw);
  background:var(--navy);display:flex;flex-direction:column;z-index:100;
}
.sb-brand{padding:18px 14px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.sb-logo{width:34px;height:34px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
.sb-brand-name{font-weight:700;color:#fff;font-size:13px;line-height:1.3}
.sb-brand-sub{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:.8px}
.sb-nav{padding:10px 8px;flex:1;overflow-y:auto}
.sb-sec{font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.9px;padding:10px 8px 4px}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:8px;cursor:pointer;
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;
  transition:all .15s;margin-bottom:1px;
}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.nav-item.active{background:var(--navy-a);color:#fff}
.nav-icon{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.sb-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,0.08)}

/* ── Main ── */
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
.topbar{
  height:var(--th);background:var(--card);border-bottom:1px solid var(--border);
  padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.tb-title{font-size:16px;font-weight:700;color:var(--t1)}
.tb-sub{font-size:11px;color:var(--t2)}
.tb-right{display:flex;align-items:center;gap:10px}
.sys-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sys-badge.run{background:var(--green-l);color:#166534}
.sys-badge.stop{background:var(--red-l);color:#991b1b}
.sys-badge.warn{background:var(--yellow-l);color:#92400e}
.sys-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sys-time{font-size:11px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.page{padding:18px 22px;flex:1}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.link-sm{font-size:11px;color:var(--blue);cursor:pointer;font-weight:600}
.link-sm:hover{text-decoration:underline}

/* ── Grids ── */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gap{margin-bottom:14px}

/* ── Status display ── */
.big-status{font-size:26px;font-weight:800;line-height:1}
.bs-run{color:var(--green)} .bs-stuck{color:var(--red)} .bs-nofeed{color:var(--yellow)} .bs-stop{color:var(--t3)}
.big-hz{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hz-unit{font-size:20px;font-weight:600;color:var(--t2)}
.big-sub{font-size:12px;color:var(--t2);margin-top:4px}

/* ── Stat tile ── */
.stat-label{font-size:11px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.stat-val{font-size:22px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* ── Confidence bar ── */
.conf-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.conf-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

/* ── Hz chips ── */
.hz-chips{display:flex;gap:8px;margin-top:12px}
.hz-chip{flex:1;text-align:center;padding:8px 4px;border:2px solid var(--border);border-radius:8px;cursor:default;transition:all .2s}
.hz-chip.act{border-color:var(--blue);background:var(--blue-l)}
.chip-lbl{font-size:10px;color:var(--t2);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.chip-hz{font-size:19px;font-weight:800;color:var(--t1)}
.chip-unit{font-size:11px;font-weight:500;color:var(--t2)}

/* ── Camera frame ── */
.cam-wrap{background:#0a0e1a;border-radius:8px;overflow:hidden;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.cam-wrap img{width:100%;height:100%;object-fit:contain}
.cam-no-feed{color:rgba(255,255,255,0.35);font-size:13px;text-align:center;padding:20px}
.cam-no-feed-icon{font-size:32px;display:block;margin-bottom:8px}
.cam-overlay{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:5px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-lbl{font-size:10px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1px}
.ai-overlay{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);border-radius:6px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between}
.ai-lbl{font-size:12px;font-weight:700;color:#fff}
.ai-conf{font-size:11px;color:rgba(255,255,255,.65)}

/* ── Alert items ── */
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dot-critical{background:var(--red)} .dot-warning{background:var(--yellow)} .dot-info{background:var(--blue)}
.alert-tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.tag-CRITICAL{background:var(--red-l);color:var(--red)} .tag-WARNING{background:var(--yellow-l);color:var(--yellow)} .tag-INFO{background:var(--blue-l);color:var(--blue)}

/* ── Status rows ── */
.sr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.sr:last-child{border-bottom:none}
.sr-k{color:var(--t2)}
.sr-v{font-weight:600}

/* ── History ── */
.hi{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.hi:last-child{border-bottom:none}
.hi-from{color:var(--t2)} .hi-arrow{color:var(--t3);font-size:11px} .hi-to{font-weight:700}
.hi-time{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}

/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:var(--rs);border:none;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff} .btn-primary:hover{background:#1d4ed8}
.btn-danger{background:var(--red);color:#fff} .btn-danger:hover{background:#b91c1c}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--t1)} .btn-outline:hover{background:var(--page)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Tabs ── */
.tabs{display:flex;gap:3px;margin-bottom:14px}
.tab{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:inherit;transition:all .15s}
.tab.act{background:var(--blue);color:#fff}
.tab:hover:not(.act){background:var(--border)}

/* ── OEE ── */
.oee-big{font-size:44px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;text-align:center}
.oee-lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;text-align:center;margin-top:2px}

/* ── Metric bar ── */
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mlbl{font-size:12px;color:var(--t2);width:90px;flex-shrink:0}
.mbar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.mfill{height:100%;border-radius:3px;transition:width .5s}
.mval{font-size:12px;font-weight:700;width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Feeder bar ── */
.fbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:8px 0}
.fs-run{background:var(--green)} .fs-nofeed{background:var(--yellow)} .fs-stuck{background:var(--red)}
.fl{display:flex;gap:14px;flex-wrap:wrap}
.fli{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.fld{width:9px;height:9px;border-radius:50%}

/* ── Chart ── */
.chart-w{position:relative;height:160px}
.chart-lg{height:200px}

/* ── Login ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f1f5f9,#e2e8f0)}
.login-card{background:#fff;border-radius:16px;padding:36px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid var(--border)}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo-box{width:52px;height:52px;background:var(--brand);border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff}
.login-h{font-size:20px;font-weight:800}
.login-s{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.form-title{font-size:19px;font-weight:800;margin-bottom:3px}
.form-sub{font-size:13px;color:var(--t2);margin-bottom:22px}
.fgrp{margin-bottom:14px}
.flbl{font-size:12px;font-weight:700;color:var(--t1);display:block;margin-bottom:5px}
.finput{width:100%;padding:10px 11px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;outline:none;color:var(--t1);transition:border-color .15s}
.finput:focus{border-color:var(--blue)}
.finput.err{border-color:var(--red)}
.login-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s}
.login-btn:hover{background:#1d4ed8}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-err{background:var(--red-l);color:var(--red);border-radius:var(--rs);padding:9px 11px;font-size:13px;margin-top:10px}
.login-hint{text-align:center;font-size:11px;color:var(--t3);margin-top:14px}

/* ── Spinner ── */
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Modal ── */
.modal-over{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500}
.modal-box{background:#fff;border-radius:var(--r);padding:22px;width:400px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px}

/* ── No-data ── */
.no-data{text-align:center;padding:32px;color:var(--t3);font-size:13px}

/* ── Pill badges ── */
.pill{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill-green{background:var(--green-l);color:#166534}
.pill-red{background:var(--red-l);color:#991b1b}
.pill-blue{background:var(--blue-l);color:#1e40af}
.pill-yellow{background:var(--yellow-l);color:#92400e}

/* ── VFD manual control hz btns ── */
.hz-preset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ── Dark-mode (system) ── */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0d1117;--card:#161b22;--t1:#f0f6fc;--t2:#8b949e;--t3:#484f58;--border:#30363d;--border2:#444c56;
  }
}
:root[data-theme="dark"]{
  --page:#0d1117;--card:#161b22;--t1:#f0f6fc;--t2:#8b949e;--t3:#484f58;--border:#30363d;--border2:#444c56;
}

@media(max-width:900px){
  .g3,.g4{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
}
@media(max-width:620px){
  .sidebar{width:60px}
  .sb-brand-name,.sb-brand-sub,.nav-item span:not(.nav-icon){display:none}
  .main{margin-left:60px}
  .g3,.g4,.g2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div v-if="!authed" class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-box">K</div>
        <div class="login-h">Kannan Blue Metals</div>
        <div class="login-s">Crusher Monitor System</div>
      </div>
      <div class="form-title">Sign in</div>
      <div class="form-sub">Chennimalai Crusher Plant</div>
      <div class="fgrp">
        <label class="flbl">Username</label>
        <input class="finput" :class="{err:loginErr}" v-model="lu" @keyup.enter="doLogin" autocomplete="username" placeholder="Username">
      </div>
      <div class="fgrp">
        <label class="flbl">Password</label>
        <input class="finput" :class="{err:loginErr}" v-model="lp" @keyup.enter="doLogin" type="password" autocomplete="current-password" placeholder="Password">
      </div>
      <button class="login-btn" @click="doLogin" :disabled="loginBusy">
        <span v-if="loginBusy" class="spin"></span>
        <span>{{ loginBusy ? 'Signing in...' : 'Sign in →' }}</span>
      </button>
      <div v-if="loginErr" class="login-err">{{ loginErr }}</div>
      <div class="login-hint">{{ piUrl }}</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <template v-else>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-brand">
        <div class="sb-logo">K</div>
        <div>
          <div class="sb-brand-name">Kannan Blue Metals</div>
          <div class="sb-brand-sub">Crusher Monitor</div>
        </div>
      </div>
      <div class="sb-nav">
        <div class="sb-sec">Main</div>
        <div class="nav-item" :class="{active:pg==='dash'}" @click="pg='dash'">
          <span class="nav-icon">⊞</span><span>Dashboard</span>
        </div>
        <div class="nav-item" :class="{active:pg==='machine'}" @click="pg='machine'">
          <span class="nav-icon">⚙</span><span>Machine</span>
        </div>
        <div class="nav-item" :class="{active:pg==='camera'}" @click="pg='camera'">
          <span class="nav-icon">📷</span><span>Camera</span>
        </div>
        <div class="sb-sec">Monitor</div>
        <div class="nav-item" :class="{active:pg==='alerts'}" @click="pg='alerts'">
          <span class="nav-icon">🔔</span><span>Alerts</span>
          <span v-if="alertCount>0" class="nav-badge">{{ alertCount }}</span>
        </div>
        <div class="nav-item" :class="{active:pg==='analytics'}" @click="pg='analytics'">
          <span class="nav-icon">📊</span><span>Analytics</span>
        </div>
      </div>
      <div class="sb-foot">
        <div class="nav-item" @click="showSet=true">
          <span class="nav-icon">⚙</span><span>Settings</span>
        </div>
        <div class="nav-item" @click="doLogout">
          <span class="nav-icon">⎋</span><span>Logout</span>
        </div>
      </div>
    </aside>

    <!-- Content -->
    <div class="main">
      <header class="topbar">
        <div>
          <div class="tb-title">{{ pageTitle }}</div>
          <div class="tb-sub">Kannan Blue Metals · Chennimalai Crusher Plant</div>
        </div>
        <div class="tb-right">
          <span class="sys-badge" :class="sysBadgeCls">
            <span class="sys-dot"></span>{{ sysBadgeTxt }}
          </span>
          <span class="sys-time">{{ now }}</span>
        </div>
      </header>

      <div class="page">

        <!-- ═══ DASHBOARD ═══ -->
        <template v-if="pg==='dash'">
          <div class="g3 gap">
            <!-- Crusher Status -->
            <div class="card">
              <div class="card-title">⚙ CRUSHER STATUS</div>
              <div :class="crusherCls" class="big-status">{{ c.machine_status || '—' }}</div>
              <div class="big-sub" style="margin-top:5px">{{ cStatusDesc }}</div>
              <div style="margin-top:11px;font-size:12px;color:var(--t2)">
                Since <strong>{{ c.status_since || '—' }}</strong>
              </div>
              <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
                <span class="pill" :class="vfd.connected?'pill-green':'pill-red'">VFD {{ vfd.connected?'Online':'Offline' }}</span>
                <span class="pill" :class="camStatus==='live'?'pill-green':'pill-yellow'">Camera {{ camStatus || '—' }}</span>
              </div>
            </div>

            <!-- AI Detection -->
            <div class="card">
              <div class="card-title">🤖 AI FEEDER DETECTION</div>
              <div :class="aiCls" class="big-status">{{ aiDisp }}</div>
              <div class="big-sub" style="margin-top:5px">{{ jawLblDisp }} · {{ confPct }}% confidence</div>
              <div class="conf-bar">
                <div class="conf-fill" :style="{width:confPct+'%'}"></div>
              </div>
              <div style="font-size:11px;color:var(--t2);margin-top:4px">Frames: {{ c.frame_count||0 }} total</div>
              <div style="margin-top:8px;font-size:12px">
                Partial stuck: <strong>{{ c.partial_secs||0 }}s</strong>/15s ·
                Empty: <strong>{{ c.empty_secs||0 }}s</strong>/30s
              </div>
            </div>

            <!-- VFD Card -->
            <div class="card">
              <div class="card-title-row">
                <span class="card-title" style="margin:0">⚡ FEEDER VFD</span>
                <span class="link-sm" @click="pg='machine'">Control →</span>
              </div>
              <div style="display:flex;align-items:baseline;gap:3px">
                <span class="big-hz">{{ actualHz }}</span>
                <span class="hz-unit">Hz</span>
              </div>
              <div class="big-sub">{{ actualHz }} Hz actual · {{ vfd.status_word?.running?'Running':'Stopped' }}</div>
              <div style="margin-top:8px;font-size:12px;display:flex;gap:12px">
                <span>TARGET <strong :style="{color:aiColor}">{{ targetHz }} Hz</strong></span>
                <span>AI <strong :style="{color:aiColor}">{{ aiShort }}</strong></span>
              </div>
              <div class="hz-chips">
                <div class="hz-chip" :class="{act:activeChip==='full'}">
                  <div class="chip-lbl">Full</div>
                  <div class="chip-hz">30<span class="chip-unit">Hz</span></div>
                </div>
                <div class="hz-chip" :class="{act:activeChip==='partial'}">
                  <div class="chip-lbl">Partial</div>
                  <div class="chip-hz">37<span class="chip-unit">Hz</span></div>
                </div>
                <div class="hz-chip" :class="{act:activeChip==='empty'}">
                  <div class="chip-lbl">Empty</div>
                  <div class="chip-hz">43<span class="chip-unit">Hz</span></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Today stats -->
          <div class="card gap">

        </template>

      </div><!-- page -->
    </div><!-- main -->

    <!-- Manual VFD Modal -->
    <div class="modal-over" v-if="showManual" @click.self="showManual=false">
      <div class="modal-box">
        <div class="modal-title">🔧 Manual VFD Control</div>
        <div style="font-size:13px;color:var(--t2);margin-bottom:14px">Send a specific frequency to the ABB ACS580 drive.</div>
        <div class="fgrp">
          <label class="flbl">Target Hz (0–50)</label>
          <input class="finput" v-model.number="manHz" type="number" min="0" max="50" step="1" placeholder="e.g. 35">
        </div>
        <div class="hz-preset">
          <button class="btn btn-outline btn-sm" @click="manHz=30">30 Hz</button>
          <button class="btn btn-outline btn-sm" @click="manHz=37">37 Hz</button>
          <button class="btn btn-outline btn-sm" @click="manHz=43">43 Hz</button>
          <button class="btn btn-danger btn-sm" @click="sendHz(0)">⏹ Stop</button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" @click="sendHz(manHz)">Send Command</button>
          <button class="btn btn-outline" style="flex:1" @click="showManual=false">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-over" v-if="showSet" @click.self="showSet=false">
      <div class="modal-box">
        <div class="modal-title">⚙ Settings</div>
        <div class="fgrp">
          <label class="flbl">Pi Server URL</label>
          <input class="finput" v-model="piUrlEdit" placeholder="http://192.168.0.234:8000">
        </div>
        <div style="font-size:12px;color:var(--t2);margin-bottom:14px">The FastAPI backend running on the Raspberry Pi.</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" @click="saveSettings">Save &amp; Reconnect</button>
          <button class="btn btn-outline" style="flex:1" @click="showSet=false">Cancel</button>
        </div>
      </div>
    </div>
  </template>

</div><!-- #app -->

<script>
const { createApp, ref, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

createApp({
  setup() {
    // ── Config ───────────────────────────────────────────────
    const piUrl    = ref(localStorage.getItem('kbm_pi_url') || 'http://192.168.0.234:8000');
    const piUrlEdit = ref(piUrl.value);

    // ── Auth ─────────────────────────────────────────────────
    const authed   = ref(!!sessionStorage.getItem('kbm_authed'));
    const lu       = ref(''); const lp = ref('');
    const loginBusy = ref(false); const loginErr = ref('');

    // ── UI ───────────────────────────────────────────────────
    const pg        = ref('dash');
    const now       = ref('');
    const showManual = ref(false); const showSet = ref(false);
    const manHz     = ref(30);
    const alertFilter = ref('all'); const aTab = ref('analytics');

    // ── Data ─────────────────────────────────────────────────
    const c       = ref({});   // crusher state
    const vfd     = ref({});   // vfd status
    const frame   = ref(null); // base64 jpeg
    const history = ref([]);
    const camStatus = ref('unknown');
    const camFps  = ref(0);

    // ── Charts ───────────────────────────────────────────────
    const vfdChartRef       = ref(null);
    const analyticsChartRef = ref(null);
    let vfdChI = null; let anaChI = null;
    const vfdLog = ref([]);

    // ── Intervals ────────────────────────────────────────────
    let pollT = null; let clockT = null; let histT = null;

    // ── API helper ───────────────────────────────────────────
    const api = async (path, opts = {}) => {
      try {
        const r = await fetch(piUrl.value + path, {
          headers: { 'Content-Type': 'application/json' }, ...opts
        });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    };

    // ── Computed ─────────────────────────────────────────────
    const confPct = computed(() => Math.round((c.value.jaw_conf || 0) * 100));

    const jawLblDisp = computed(() => {
      const l = c.value.jaw_label || 'unknown';
      return l.charAt(0).toUpperCase() + l.slice(1);
    });

    const aiDisp = computed(() => {
      const l = c.value.jaw_label || '';
      if (l === 'jaw filled') return 'FULL';
      if (l === 'jaw partially filled') return 'PARTIAL';
      if (l === 'jaw empty') return 'EMPTY';
      return l.toUpperCase() || '—';
    });

    const aiShort = computed(() => {
      const l = c.value.jaw_label || '';
      if (l === 'jaw filled') return 'FULL';
      if (l === 'jaw partially filled') return 'PARTIAL';
      if (l === 'jaw empty') return 'EMPTY';
      return '—';
    });

    const aiColor = computed(() => {
      const s = aiShort.value;
      if (s === 'FULL') return 'var(--green)';
      if (s === 'PARTIAL') return 'var(--blue)';
      if (s === 'EMPTY') return 'var(--brand)';
      return 'var(--t2)';
    });

    const aiCls = computed(() => {
      const s = aiShort.value;
      if (s === 'FULL') return 'bs-run';
      if (s === 'PARTIAL') return 'bs-stuck';
      if (s === 'EMPTY') return 'bs-nofeed';
      return 'bs-stop';
    });

    const crusherCls = computed(() => {
      const s = c.value.machine_status || '';
      if (s === 'NORMAL') return 'bs-run';
      if (s === 'STONE STUCK') return 'bs-stuck';
      if (s === 'NO RAW MATERIAL') return 'bs-nofeed';
      return 'bs-stop';
    });

    const cStatusDesc = computed(() => {
      const s = c.value.machine_status || '';
      if (s === 'NORMAL') return 'Normal operation';
      if (s === 'STONE STUCK') return 'Stone stuck — reducing speed';
      if (s === 'NO RAW MATERIAL') return 'No feed — empty feeder';
      if (s === 'FAULT') return 'Drive fault detected';
      return 'Waiting for data...';
    });

    // Hz from RPM (motor 1500 RPM @ 50 Hz)
    const rpmToHz = (rpm) => Math.round(rpm * 50 / 1500 * 10) / 10;

    const targetHz = computed(() => rpmToHz(c.value.target_vfd_rpm || 0));
    const actualHz = computed(() => rpmToHz(vfd.value.actual_rpm || 0));

    const activeChip = computed(() => {
      const hz = parseFloat(targetHz.value);
      if (hz > 0 && hz <= 31) return 'full';
      if (hz > 31 && hz <= 38) return 'partial';
      if (hz > 38) return 'empty';
      return '';
    });

    const alerts    = computed(() => c.value.active_alerts || []);
    const alertCount = computed(() => c.value.alert_count || 0);
    const critCount  = computed(() => alerts.value.filter(a => a.level === 'critical').length);
    const warnCount  = computed(() => alerts.value.filter(a => a.level === 'warning').length);
    const infoCount  = computed(() => alerts.value.filter(a => a.level === 'info').length);
    const filtAlerts = computed(() => {
      if (alertFilter.value === 'all') return alerts.value;
      return alerts.value.filter(a => a.level === alertFilter.value);
    });

    const sysBadgeTxt = computed(() => {
      if (!vfd.value.connected) return 'VFD OFFLINE';
      const s = c.value.machine_status;
      if (s === 'NORMAL') return 'SYSTEM RUNNING';
      if (s === 'STONE STUCK') return 'STONE STUCK';
      if (s === 'NO RAW MATERIAL') return 'NO FEED';
      return 'ONLINE';
    });
    const sysBadgeCls = computed(() => {
      const s = c.value.machine_status;
      if (s === 'NORMAL') return 'run';
      if (s === 'STONE STUCK' || !vfd.value.connected) return 'stop';
      return 'warn';
    });

    const pageTitle = computed(() => {
      const m = { dash:'Dashboard', machine:'Machine Control', camera:'Live Camera', alerts:'Alerts', analytics:'Analytics & Reports' };
      return m[pg.value] || 'Dashboard';
    });

    const statusColor = (s) => {
      if (s === 'NORMAL') return 'var(--green)';
      if (s === 'STONE STUCK') return 'var(--red)';
      if (s === 'NO RAW MATERIAL') return 'var(--yellow)';
      return 'var(--t2)';
    };

    // ── Auth ─────────────────────────────────────────────────
    const doLogin = async () => {
      if (!lu.value || !lp.value) { loginErr.value = 'Enter username and password.'; return; }
      loginBusy.value = true; loginErr.value = '';
      const res = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username: lu.value, password: lp.value })
      });
      loginBusy.value = false;
      if (res?.ok) {
        sessionStorage.setItem('kbm_authed', '1');
        authed.value = true;
        startAll();
      } else {
        loginErr.value = res?.error || 'Invalid credentials.';
      }
    };

    const doLogout = () => {
      sessionStorage.removeItem('kbm_authed');
      authed.value = false;
      stopAll();
    };

    // ── Fetch ─────────────────────────────────────────────────
    const fetchCore = async () => {
      const [cr, vr, hr, sr] = await Promise.all([
        api('/api/crusher'),
        api('/api/vfd/status'),
        api('/api/history'),
        api('/api/snapshot'),
      ]);
      if (cr) c.value = cr;
      if (vr) vfd.value = vr;
      if (hr?.history) history.value = hr.history;
      if (sr?.frame)   frame.value = sr.frame;
      // camera status from crusher state
      if (cr) {
        camStatus.value = cr.cam_status || 'unknown';
        camFps.value    = cr.camera_fps || 0;
      }
    };

    const fetchVfdLog = async () => {
      const d = await api('/api/db/vfd?minutes=60');
      if (d?.vfd_logs) {
        vfdLog.value = d.vfd_logs.slice(-40);
        updateCharts();
      }
    };

    // ── Charts ────────────────────────────────────────────────
    const initCharts = () => {
      nextTick(() => {
        if (vfdChartRef.value && !vfdChI) {
          vfdChI = new Chart(vfdChartRef.value, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Hz', data: [], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.1)', fill: true, tension: 0.35, borderWidth: 2, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 55, grid: { color: '#e2e8f0' }, ticks: { font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 7 } } } }
          });
        }
        if (analyticsChartRef.value && !anaChI) {
          anaChI = new Chart(analyticsChartRef.value, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Hz', data: [], backgroundColor: 'rgba(37,99,235,.7)', borderRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 55, grid: { color: '#e2e8f0' }, ticks: { font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 8 } } } }
          });
        }
        if (vfdLog.value.length) updateCharts();
      });
    };

    const updateCharts = () => {
      const logs   = vfdLog.value;
      const labels = logs.map(l => (l.ts || '').split(' ')[1]?.slice(0, 5) || '');
      const data   = logs.map(l => rpmToHz(l.vfd_rpm || 0));
      [vfdChI, anaChI].forEach(ch => {
        if (!ch) return;
        ch.data.labels = labels;
        ch.data.datasets[0].data = data;
        ch.update('none');
      });
    };

    watch(pg, () => { if (pg.value === 'machine' || pg.value === 'analytics') setTimeout(initCharts, 80); });

    // ── Actions ───────────────────────────────────────────────
    const stopVfd    = () => api('/api/vfd/stop',        { method: 'POST' });
    const resetFault = () => api('/api/vfd/reset',       { method: 'POST' });
    const restartCam = () => api('/api/camera/restart',  { method: 'POST' });
    const resetShift = () => { if (confirm('Reset shift? Saves current report and resets timers.')) api('/api/shift/reset', { method: 'POST' }); };

    const snapShot = () => {
      if (!frame.value) return;
      const a = document.createElement('a');
      a.href = 'data:image/jpeg;base64,' + frame.value;
      a.download = 'snapshot_' + Date.now() + '.jpg';
      a.click();
    };

    const sendHz = async (hz) => {
      const rpm = Math.round(parseFloat(hz) * 1500 / 50);
      if (rpm === 0) await api('/api/vfd/stop', { method: 'POST' });
      else await api(`/api/vfd/set/${rpm}`, { method: 'POST' });
      showManual.value = false;
    };

    const saveSettings = () => {
      piUrl.value = piUrlEdit.value.trim().replace(/\/$/, '');
      localStorage.setItem('kbm_pi_url', piUrl.value);
      showSet.value = false;
      fetchCore();
    };

    // ── Lifecycle ─────────────────────────────────────────────
    const startAll = () => {
      fetchCore();
      fetchVfdLog();
      pollT = setInterval(fetchCore, 2000);
      histT = setInterval(fetchVfdLog, 30000);
    };

    const stopAll = () => {
      clearInterval(pollT); clearInterval(histT);
    };

    onMounted(() => {
      now.value = new Date().toLocaleString();
      clockT = setInterval(() => { now.value = new Date().toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }); }, 1000);
      if (authed.value) startAll();
    });

    onUnmounted(() => { stopAll(); clearInterval(clockT); });

    return {
      piUrl, piUrlEdit, authed, lu, lp, loginBusy, loginErr, doLogin, doLogout,
      pg, now, showManual, showSet, manHz, alertFilter, aTab,
      c, vfd, frame, history, camStatus, camFps,
      confPct, jawLblDisp, aiDisp, aiShort, aiColor, aiCls, crusherCls, cStatusDesc,
      targetHz, actualHz, activeChip,
      alerts, alertCount, critCount, warnCount, infoCount, filtAlerts,
      sysBadgeTxt, sysBadgeCls, pageTitle, statusColor,
      vfdChartRef, analyticsChartRef,
      stopVfd, resetFault, restartCam, resetShift, snapShot, sendHz, saveSettings,
    };
  }
}).mount('#app');
</script>
</body>
</html>
